<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Responsive meta tag: needed for Bootstrap's mobile-first grid -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment | Bookstore</title>
  <!-- Bootstrap 5 CSS (CDN) and custom fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="content-page">

<h1 class="h3 mb-3">Payment</h1>
<div class="alert alert-info d-none" id="empty-box">Your cart is empty. <a href="catalogue.html">Add some books</a> first.</div>
<div class="alert alert-success d-none" id="order-box">
  <h2 class="h5">Order placed. Thank you!</h2>
  <p class="mb-1">Order number: <strong id="order-id"></strong></p>
  <p class="mb-1">Payment method: <strong id="order-method"></strong></p>
  <p class="mb-2">Amount: <strong id="order-total"></strong></p>
  <a class="btn btn-success btn-sm" href="catalogue.html">Continue shopping</a>
</div>
<form id="pay-form" novalidate class="mx-auto" style="max-width: 1000px;">
  <div class="row g-4">
    <div class="col-12 col-lg-5 order-lg-2">
      <div class="card"><div class="card-body">
        <h2 class="h5">Order summary</h2>
        <table class="table table-sm"><tbody id="summary-body"></tbody>
          <tfoot><tr><td colspan="2" class="fw-bold">Total</td><td class="text-end price" id="pay-total"></td></tr></tfoot></table>
      </div></div>
    </div>
    <div class="col-12 col-lg-7 order-lg-1">
      <div class="mb-3"><label class="form-label" for="pay-address">Delivery address</label>
        <textarea class="form-control" id="pay-address" rows="2"></textarea><div class="form-error" id="pay-address-error"></div></div>

      <span class="form-label d-block">Payment option</span>
      <div class="d-grid gap-2 mb-3">
        <label class="pay-option"><input class="form-check-input me-2" type="radio" name="method" value="card" checked> Credit / Debit card</label>
        <label class="pay-option"><input class="form-check-input me-2" type="radio" name="method" value="upi"> UPI</label>
        <label class="pay-option"><input class="form-check-input me-2" type="radio" name="method" value="netbanking"> Net banking</label>
        <label class="pay-option"><input class="form-check-input me-2" type="radio" name="method" value="cod"> Cash on delivery</label>
      </div>

      <div class="pay-panel" data-method="card">
        <div class="row g-2">
          <div class="col-12"><label class="form-label" for="card-number">Card number</label>
            <input class="form-control" id="card-number" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456"><div class="form-error" id="card-number-error"></div></div>
          <div class="col-12"><label class="form-label" for="card-name">Name on card</label>
            <input class="form-control" id="card-name" autocomplete="cc-name"><div class="form-error" id="card-name-error"></div></div>
          <div class="col-6"><label class="form-label" for="card-expiry">Expiry (MM/YY)</label>
            <input class="form-control" id="card-expiry" maxlength="5" placeholder="08/29" autocomplete="cc-exp"><div class="form-error" id="card-expiry-error"></div></div>
          <div class="col-6"><label class="form-label" for="card-cvv">CVV</label>
            <input class="form-control" id="card-cvv" type="password" maxlength="3" inputmode="numeric" autocomplete="cc-csc"><div class="form-error" id="card-cvv-error"></div></div>
        </div>
      </div>
      <div class="pay-panel d-none" data-method="upi">
        <label class="form-label" for="upi-id">UPI ID</label>
        <input class="form-control" id="upi-id" placeholder="name@bank"><div class="form-error" id="upi-id-error"></div>
      </div>
      <div class="pay-panel d-none" data-method="netbanking">
        <label class="form-label" for="bank">Choose your bank</label>
        <select class="form-select" id="bank"><option value="">Select bank</option><option>State Bank of India</option><option>HDFC Bank</option><option>ICICI Bank</option><option>Punjab National Bank</option><option>Axis Bank</option></select>
        <div class="form-error" id="bank-error"></div>
      </div>
      <div class="pay-panel d-none" data-method="cod">
        <p class="text-muted mb-0">Pay in cash when the books are delivered.</p>
      </div>

      <p class="small text-muted mt-3">Demo page: nothing is sent or stored. Do not enter real card details.</p>
      <button class="btn btn-success" type="submit">Pay now</button>
    </div>
  </div>
</form>

<script src="script.js"></script>
</body>
</html>
