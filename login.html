<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Responsive meta tag: needed for Bootstrap's mobile-first grid -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Bookstore</title>
  <!-- Bootstrap 5 CSS (CDN) and custom fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="content-page">

<h1 class="h3 mb-3">Login Page</h1>
<div class="alert alert-success d-none" id="login-ok">Login successful (demo, no server).</div>
<form id="login-form" novalidate class="card card-body col-md-8 col-lg-5 mx-auto">
  <div class="mb-3"><label class="form-label" for="login-user">User Name</label>
    <input class="form-control" id="login-user" type="text" autocomplete="username">
    <div class="form-error" id="login-user-error"></div></div>
  <div class="mb-3"><label class="form-label" for="login-password">Password</label>
    <input class="form-control" id="login-password" type="password" autocomplete="current-password">
    <div class="form-error" id="login-password-error"></div></div>
  <div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Submit</button><button class="btn btn-outline-secondary" type="reset">Reset</button></div>
</form>

<script src="script.js"></script>
</body>
</html>
