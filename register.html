<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Responsive meta tag: needed for Bootstrap's mobile-first grid -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration | Bookstore</title>
  <!-- Bootstrap 5 CSS (CDN) and custom fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="content-page">

<h1 class="h3 mb-3">Registration</h1>

<!-- Green box shown after a successful registration (hidden at first) -->
<div class="alert alert-success d-none" id="success-box"><strong>Registration successful!</strong> You can now use the Login link.</div>

<!-- Simple registration form: only 3 fields - name, email, password.
     novalidate switches off the browser's own popups so OUR JavaScript messages show. -->
<form id="register-form" novalidate class="card card-body col-md-6 mx-auto">

  <div class="mb-3">
    <label class="form-label" for="name">Name</label>
    <input class="form-control" id="name" type="text" autocomplete="name" placeholder="At least 6 letters">
    <div class="form-error" id="name-error"></div>
  </div>

  <div class="mb-3">
    <label class="form-label" for="email">Email ID</label>
    <input class="form-control" id="email" type="email" autocomplete="email" placeholder="name@domain.com">
    <div class="form-error" id="email-error"></div>
  </div>

  <div class="mb-3">
    <label class="form-label" for="password">Password</label>
    <input class="form-control" id="password" type="password" autocomplete="new-password" placeholder="Min 6 characters">
    <div class="form-error" id="password-error"></div>
  </div>

  <div class="d-flex gap-2">
    <button class="btn btn-success" type="submit">Register</button>
    <button class="btn btn-outline-secondary" type="reset">Reset</button>
  </div>

</form>

<script src="script.js"></script>
</body>
</html>
