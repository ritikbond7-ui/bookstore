<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Responsive meta tag: needed for Bootstrap's mobile-first grid -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration | Bookstore</title>
  <!-- Bootstrap 5 CSS (CDN) and custom fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="content-page">

<h1 class="h3 mb-3">Registration</h1>
<div class="alert alert-success d-none" id="success-box"><strong>Registration successful!</strong> All fields passed validation. You can now use the Login link.</div>
<!-- novalidate switches off the browser's own popups so OUR JavaScript messages show -->
<form id="register-form" novalidate class="card card-body col-xl-9 mx-auto">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label" for="name">Name</label>
      <input class="form-control" id="name" type="text" autocomplete="name" placeholder="Alphabets only, min 6">
      <div class="form-error" id="name-error"></div></div>
    <div class="col-md-6"><label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" type="password" autocomplete="new-password" placeholder="Min 6 characters">
      <div class="form-error" id="password-error"></div></div>
    <div class="col-md-6"><label class="form-label" for="email">Email ID</label>
      <input class="form-control" id="email" type="email" autocomplete="email" placeholder="name@domain.com">
      <div class="form-error" id="email-error"></div></div>
    <div class="col-md-6"><label class="form-label" for="phone">Phone Number</label>
      <input class="form-control" id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10 digits">
      <div class="form-error" id="phone-error"></div></div>
    <div class="col-12"><span class="form-label d-block">Sex</span>
      <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="sex" id="sex-m" value="Male"><label class="form-check-label" for="sex-m">Male</label></div>
      <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="sex" id="sex-f" value="Female"><label class="form-check-label" for="sex-f">Female</label></div>
      <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="sex" id="sex-o" value="Other"><label class="form-check-label" for="sex-o">Other</label></div>
      <div class="form-error" id="sex-error"></div></div>
    <div class="col-12"><span class="form-label d-block">Date of Birth</span>
      <div class="row g-2">
        <div class="col-4"><select class="form-select" id="dob-day" aria-label="Day"></select></div>
        <div class="col-4"><select class="form-select" id="dob-month" aria-label="Month"></select></div>
        <div class="col-4"><select class="form-select" id="dob-year" aria-label="Year"></select></div>
      </div><div class="form-error" id="dob-error"></div></div>
    <div class="col-12"><span class="form-label d-block">Languages Known</span>
      <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="lang" id="l1" value="English"><label class="form-check-label" for="l1">English</label></div>
      <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="lang" id="l2" value="Hindi"><label class="form-check-label" for="l2">Hindi</label></div>
      <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="lang" id="l3" value="Telugu"><label class="form-check-label" for="l3">Telugu</label></div>
      <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="lang" id="l4" value="Tamil"><label class="form-check-label" for="l4">Tamil</label></div>
      <div class="form-error" id="lang-error"></div></div>
    <div class="col-12"><label class="form-label" for="address">Address</label>
      <textarea class="form-control" id="address" rows="3" placeholder="House no., street, city, PIN"></textarea>
      <div class="form-error" id="address-error"></div></div>
    <div class="col-12 d-flex gap-2"><button class="btn btn-success" type="submit">Register</button><button class="btn btn-outline-secondary" type="reset">Reset</button></div>
  </div>
</form>

<script src="script.js"></script>
</body>
</html>
