<body class="frames-page">
<!-- FRAME STRUCTURE (as in the lab sheet)
     top frame     : logo, web site name, links (Home, Login, Registration, Catalogue, Cart)
     left frame    : branch links (CSE, ECE, EEE, CIVIL)
     right frame   : named "content". Every link in the top/left frames uses target="content",
                     so the page it points to loads in the right frame.
     <frameset> is obsolete in HTML5, so we use <iframe> elements arranged with CSS Grid. -->
<div class="frame-layout">
  <iframe class="f-top"     name="top"     src="top.html"  title="Header and navigation"></iframe>
  <iframe class="f-left"    name="left"    src="left.html" title="Branches"></iframe>
  <iframe class="f-content" name="content" src="home.html" title="Page content"></iframe>
