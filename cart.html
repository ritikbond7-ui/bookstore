<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Responsive meta tag: needed for Bootstrap's mobile-first grid -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart | Bookstore</title>
  <!-- Bootstrap 5 CSS (CDN) and custom fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="content-page">

<h1 class="h3 mb-3">Cart</h1>
<div class="table-responsive">
  <table class="table align-middle">
    <thead><tr><th>Book name</th><th>Price</th><th>Quantity</th><th>Amount</th><th></th></tr></thead>
    <tbody id="cart-body"></tbody>
    <tfoot><tr><td colspan="3" class="fw-bold">Total amount</td><td class="price fs-5" id="cart-total">$0.00</td><td></td></tr></tfoot>
  </table>
</div>
<div class="d-flex gap-2 flex-wrap justify-content-center">
  <a class="btn btn-outline-dark" href="catalogue.html">Continue shopping</a>
  <button class="btn btn-outline-danger" id="clear-cart" type="button">Clear cart</button>
  <a class="btn btn-success" id="pay-btn" href="payment.html">Proceed to payment</a>
</div>

<script src="script.js"></script>
</body>
</html>
